name: refresh-index
# Re-collect top repos from GitHub Search API and regenerate README.md weekly.
on:
  schedule:
    - cron: "0 4 * * 1" # every Monday 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect repos (GitHub Search API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/collect.py
      - name: Curate
        run: python tools/curate.py
      - name: Generate README
        run: python tools/gen_readme.py
      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/repos.json
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "chore: refresh index ($(date -u +%F))"
          git push
